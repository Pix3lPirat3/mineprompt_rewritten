version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/mineflayer-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      prismarine:
        applies-to: version-updates
        patterns:
          - "mineflayer*"
          - "minecraft-data"
          - "prismarine-*"
          - "protodef*"
          - "vec3"
        update-types:
          - minor
          - patch
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "mineflayer*"
          - "minecraft-data"
          - "prismarine-*"
          - "protodef*"
          - "vec3"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

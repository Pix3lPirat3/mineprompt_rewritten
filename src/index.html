<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://mc-heads.net; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <title>MinePrompt</title>
    <link rel="stylesheet" href="../node_modules/jquery.terminal/css/jquery.terminal.min.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/console-client.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Saved accounts">
        <header class="brand">
          <img class="brand__mark" src="img/heads/computer.png" alt="">
          <div>
            <h1>MinePrompt</h1>
            <p id="app-version">Desktop client</p>
          </div>
        </header>

        <section class="account-section">
          <div class="section-heading">
            <h2>Profiles</h2>
            <button id="add-account" class="icon-button" type="button" title="Add account" aria-label="Add account">+</button>
          </div>
          <div id="account-list" class="account-list" role="list"></div>
          <p id="account-empty" class="empty-state">No saved profiles yet.</p>
        </section>

        <footer class="sidebar__footer">
          <span class="shortcut"><kbd>Ctrl</kbd><kbd>R</kbd> reloads commands</span>
          <a href="https://github.com/Pix3lPirat3/mineprompt_rewritten">Project repository</a>
        </footer>
      </aside>

      <section class="workspace">
        <header class="session-bar">
          <div class="identity">
            <img id="active-head" class="identity__head" src="img/heads/wood_question.png" alt="Current player head">
            <div class="identity__copy">
              <div class="identity__name-row">
                <strong id="active-name">Not connected</strong>
                <span id="connection-status" class="status status--disconnected">Offline</span>
              </div>
              <span id="active-position" class="identity__meta">Connect to a Java server to begin</span>
            </div>
          </div>

          <div class="vitals" aria-label="Player vitals">
            <div id="health" class="vital-row" title="Health"></div>
            <div id="hunger" class="vital-row" title="Hunger"></div>
          </div>
        </header>

        <div id="terminal" class="terminal" aria-label="MinePrompt terminal"></div>

        <footer class="session-footer">
          <div id="effects" class="effects" aria-label="Active effects"></div>
          <div class="session-time">
            <span class="session-time__label">Session</span>
            <span id="runtime">—</span>
          </div>
        </footer>
      </section>
    </main>

    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../node_modules/jquery.terminal/js/jquery.terminal.min.js"></script>
    <script src="../node_modules/jquery.terminal/js/autocomplete_menu.js"></script>
    <script src="js/renderer.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://mc-heads.net; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <title>MinePrompt</title>
    <link rel="stylesheet" href="../node_modules/jquery.terminal/css/jquery.terminal.min.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/console-client.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Saved accounts">
        <header class="brand">
          <img class="brand__mark" src="img/heads/computer.png" alt="">
          <div>
            <h1>MinePrompt</h1>
            <p id="app-version">Desktop client</p>
          </div>
        </header>

        <section class="account-section">
          <div class="section-heading">
            <h2>Profiles</h2>
            <div class="section-actions">
              <button id="open-settings" class="section-button" type="button">Settings</button>
              <button id="add-account" class="section-button" type="button">Add</button>
            </div>
          </div>
          <div id="account-list" class="account-list" role="list"></div>
          <p id="account-empty" class="empty-state">No saved profiles yet.</p>
        </section>

        <footer class="sidebar__footer">
          <span class="shortcut"><kbd>Ctrl</kbd><kbd>R</kbd> reloads commands</span>
          <a href="https://github.com/Pix3lPirat3/mineprompt_rewritten">Project repository</a>
        </footer>
      </aside>

      <section class="workspace">
        <header class="session-bar">
          <div class="identity">
            <img id="active-head" class="identity__head" src="img/heads/wood_question.png" alt="Current player head">
            <div class="identity__copy">
              <div class="identity__name-row">
                <strong id="active-name">Not connected</strong>
                <span id="connection-status" class="status status--disconnected">Offline</span>
              </div>
              <span id="active-position" class="identity__meta">Connect to a Java server to begin</span>
            </div>
          </div>

          <button id="quick-connect" class="secondary-button" type="button">Connect</button>

          <div class="vitals" aria-label="Player vitals">
            <div id="health" class="vital-row" title="Health"></div>
            <div id="hunger" class="vital-row" title="Hunger"></div>
          </div>
        </header>

        <div id="terminal" class="terminal" aria-label="MinePrompt terminal"></div>

        <footer class="session-footer">
          <div id="effects" class="effects" aria-label="Active effects"></div>
          <div class="session-time">
            <span class="session-time__label">Session</span>
            <span id="runtime">--</span>
          </div>
        </footer>
      </section>
    </main>

    <dialog id="profile-dialog" class="dialog">
      <form id="profile-form" class="dialog__form">
        <header class="dialog__header">
          <div>
            <span class="dialog__eyebrow">Profile</span>
            <h2 id="profile-title">Add profile</h2>
          </div>
          <button class="dialog__close" type="button" data-close="profile-dialog">Close</button>
        </header>
        <input id="profile-original" type="hidden">
        <label class="field">
          <span>Account name or email</span>
          <input id="profile-username" name="username" required maxlength="254" autocomplete="username">
        </label>
        <label class="field">
          <span>Authentication</span>
          <select id="profile-auth" name="authentication">
            <option value="microsoft">Microsoft</option>
            <option value="offline">Offline mode</option>
          </select>
        </label>
        <p id="profile-error" class="dialog__error" role="alert"></p>
        <footer class="dialog__actions dialog__actions--split">
          <button id="delete-profile" class="danger-button" type="button">Delete</button>
          <div>
            <button class="secondary-button" type="button" data-close="profile-dialog">Cancel</button>
            <button class="primary-button" type="submit">Save profile</button>
          </div>
        </footer>
      </form>
    </dialog>

    <dialog id="connect-dialog" class="dialog">
      <form id="connect-form" class="dialog__form">
        <header class="dialog__header">
          <div>
            <span class="dialog__eyebrow">Java Edition</span>
            <h2>Connect to a server</h2>
          </div>
          <button class="dialog__close" type="button" data-close="connect-dialog">Close</button>
        </header>
        <div class="field-grid">
          <label class="field field--wide">
            <span>Account name or email</span>
            <input id="connect-username" required maxlength="254" autocomplete="username">
          </label>
          <label class="field">
            <span>Authentication</span>
            <select id="connect-auth">
              <option value="microsoft">Microsoft</option>
              <option value="offline">Offline mode</option>
            </select>
          </label>
          <label class="field field--wide">
            <span>Server address</span>
            <input id="connect-host" required placeholder="play.example.net" spellcheck="false">
          </label>
          <label class="field">
            <span>Port</span>
            <input id="connect-port" type="number" min="1" max="65535" value="25565" required>
          </label>
          <label class="field">
            <span>Version</span>
            <input id="connect-version" placeholder="Automatic" spellcheck="false">
          </label>
          <label class="field field--wide">
            <span>Handshake address</span>
            <input id="connect-fake-host" placeholder="Optional proxy hostname" spellcheck="false">
          </label>
        </div>
        <p id="connect-error" class="dialog__error" role="alert"></p>
        <footer class="dialog__actions">
          <button class="secondary-button" type="button" data-close="connect-dialog">Cancel</button>
          <button class="primary-button" type="submit">Connect</button>
        </footer>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="dialog">
      <form id="settings-form" class="dialog__form">
        <header class="dialog__header">
          <div>
            <span class="dialog__eyebrow">MinePrompt</span>
            <h2>Security settings</h2>
          </div>
          <button class="dialog__close" type="button" data-close="settings-dialog">Close</button>
        </header>
        <label class="field">
          <span>Server resource packs</span>
          <select id="settings-resource-packs">
            <option value="deny">Decline by default</option>
            <option value="accept">Accept automatically</option>
          </select>
        </label>
        <label class="toggle-field">
          <span>
            <strong>Online player heads</strong>
            <small>Fetch profile images from mc-heads.net. Enabling this shares player names with that service.</small>
          </span>
          <input id="settings-external-heads" type="checkbox">
        </label>
        <label class="toggle-field">
          <span>
            <strong>Remote chat commands</strong>
            <small>Allow listed players to control the connected bot with !commands.</small>
          </span>
          <input id="settings-remote-enabled" type="checkbox">
        </label>
        <label class="field">
          <span>Allowed player names</span>
          <textarea id="settings-remote-players" rows="4" placeholder="One Java username per line" spellcheck="false"></textarea>
        </label>
        <p id="settings-error" class="dialog__error" role="alert"></p>
        <footer class="dialog__actions">
          <button class="secondary-button" type="button" data-close="settings-dialog">Cancel</button>
          <button class="primary-button" type="submit">Save settings</button>
        </footer>
      </form>
    </dialog>

    <script src="../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../node_modules/jquery.terminal/js/jquery.terminal.min.js"></script>
    <script src="js/renderer.js"></script>
  </body>
</html>
